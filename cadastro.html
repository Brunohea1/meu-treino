<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Meu Treino</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #111111,
                #292929
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .cadastro-container {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        .titulo {
            text-align: center;

            margin-bottom: 30px;
        }

        .titulo h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .titulo p {
            color: #777;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .campo input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            outline: none;
        }

        .campo input:focus {
            border-color: #111;
        }

        .botao {

            width: 100%;

            padding: 15px;

            background: #111;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .botao:hover {
            background: #333;
        }

        .voltar {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>


    <div class="cadastro-container">


        <div class="titulo">

            <h1>
                Criar sua conta
            </h1>

            <p>
                Cadastre-se para continuar
            </p>

        </div>


        <form>


            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                >

            </div>


            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                >

            </div>


            <button
                type="button"
                class="botao"
                onclick="cadastrar()"
            >
                CRIAR CONTA
            </button>


        </form>


        <a href="planos.html" class="voltar">
            ← Voltar para os planos
        </a>


    </div>


    <script>

        function cadastrar() {

            const nome =
                document.getElementById("nome").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;


            if (
                nome === "" ||
                email === "" ||
                senha === "" ||
                confirmarSenha === ""
            ) {

                alert(
                    "Preencha todos os campos."
                );

                return;
            }


            if (senha !== confirmarSenha) {

                alert(
                    "As senhas não são iguais."
                );

                return;
            }


            const aluno = {

                nome: nome,

                email: email,

                senha: senha

            };


            localStorage.setItem(
                "aluno",
                JSON.stringify(aluno)
            );


            alert(
                "Cadastro realizado com sucesso!"
            );


            window.location.href =
                "login.html";

        }

    </script>


</body>

</html>
