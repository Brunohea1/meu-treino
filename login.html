<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Meu Treino</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #111111,
                #222222
            );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .login-container {

            width: 90%;
            max-width: 400px;

            background: #ffffff;

            color: #222222;

            padding: 40px 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        .titulo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitulo {

            text-align: center;

            color: #777777;

            margin-bottom: 30px;
        }

        .campo {

            margin-bottom: 20px;
        }

        .campo label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cccccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        .campo input:focus {

            border-color: #222222;
        }

        .botao {

            width: 100%;

            padding: 15px;

            background: #111111;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .botao:hover {

            background: #333333;
        }

        .cadastro {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;

            text-decoration: none;
        }

        .voltar {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #777;

            text-decoration: none;
        }

    </style>

</head>

<body>


    <div class="login-container">


        <div class="titulo">

            MEU TREINO

        </div>


        <div class="subtitulo">

            Entre na sua área de aluno

        </div>


        <form>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

            </div>


            <button
                type="button"
                class="botao"
                onclick="entrar()"
            >
                ENTRAR
            </button>


        </form>


        <a
            href="cadastro.html"
            class="cadastro"
        >
            Ainda não tenho cadastro
        </a>


        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para o início
        </a>


    </div>


    <script>

        function entrar() {

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;


            if (
                email === "" ||
                senha === ""
            ) {

                alert(
                    "Preencha seu e-mail e sua senha."
                );

                return;
            }


            const dadosSalvos =
                localStorage.getItem("aluno");


            if (!dadosSalvos) {

                alert(
                    "Nenhum cadastro encontrado. Crie sua conta primeiro."
                );

                return;
            }


            const aluno =
                JSON.parse(dadosSalvos);


            if (
                email === aluno.email &&
                senha === aluno.senha
            ) {

                localStorage.setItem(
                    "alunoLogado",
                    "true"
                );


                window.location.href =
                    "aulas.html";

            } else {

                alert(
                    "E-mail ou senha incorretos."
                );

            }

        }

    </script>


</body>

</html>
